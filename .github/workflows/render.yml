name: Render videos

# Chạy khi có thay đổi kịch bản hoặc hệ thống dựng trên nhánh main.
# Kết quả (video, giọng đọc đã tạo, báo cáo) được ghi vào nhánh "renders".
on:
  push:
    branches: [main]
    paths:
      - "videos/**"
      - "scripts/**"
      - "assets/**"
      - "package.json"
      - ".github/workflows/render.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cài FFmpeg và cho phép Chrome headless
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Cài HyperFrames
        run: npm install --no-audit --no-fund

      # Whisper (mốc từng từ cho toon và cảnh dựng sẵn): dựng whisper.cpp + tải mô hình một lần, lưu cache
      - name: Cache Whisper
        uses: actions/cache@v4
        with:
          path: ~/.whisper
          key: whisper-cpp-v1.9.5-large-v3-turbo-q5_0

      - name: Cài Whisper
        run: |
          if [ ! -x ~/.whisper/bin/whisper-cli ]; then
            git clone -q --depth 1 --branch v1.9.5 https://github.com/ggml-org/whisper.cpp /tmp/wcpp
            cmake -S /tmp/wcpp -B /tmp/wcpp/build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DWHISPER_BUILD_TESTS=OFF > /dev/null
            cmake --build /tmp/wcpp/build -j 4 --config Release --target whisper-cli > /dev/null
            mkdir -p ~/.whisper/bin && cp /tmp/wcpp/build/bin/whisper-cli ~/.whisper/bin/
            curl -sSL -o ~/.whisper/ggml-large-v3-turbo-q5_0.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo-q5_0.bin
          fi
          echo "$HOME/.whisper/bin" >> "$GITHUB_PATH"
          echo "WHISPER_MODEL=$HOME/.whisper/ggml-large-v3-turbo-q5_0.bin" >> "$GITHUB_ENV"
          echo "WHISPER_TIMEOUT=900" >> "$GITHUB_ENV"

      - name: Lấy kết quả cũ từ nhánh renders (giọng đọc đã tạo)
        run: |
          mkdir -p prev cache
          if git ls-remote --exit-code --heads origin renders >/dev/null 2>&1; then
            git fetch --depth 1 origin renders
            git archive FETCH_HEAD | tar -x -C prev
            cp -r prev/cache/. cache/ 2>/dev/null || true
          fi

      - name: Chọn kịch bản cần render
        id: pick
        run: |
          # So với commit đã render gần nhất (ghi trên nhánh renders), không phải lần push trước:
          # lần chạy bị huỷ do xếp hàng sẽ không làm sót kịch bản.
          BASE=$(cat prev/LAST_COMMIT 2>/dev/null || true)
          # Mọi kịch bản trừ phim kể chuyện (ảnh/clip media/ chỉ có trên máy)
          ALL=$(for f in videos/*/script.json; do node -e "process.exit(JSON.parse(require('fs').readFileSync('$f')).characters?1:0)" && echo $f; done)
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            FILES="$ALL"
          elif git log --format=%B "$BASE..HEAD" | grep -q '\[render-all\]'; then
            FILES="$ALL"   # commit có [render-all]: render lại tất cả (giọng đọc được dùng lại)
          else
            # Kịch bản hoặc bản sửa tay (videos/<id>/edit/) đổi: render lại video đó
            FILES=$(git diff --name-only "$BASE" HEAD -- 'videos/' | cut -d/ -f2 | sort -u | sed 's|.*|videos/&/script.json|')
            # Thêm kịch bản chưa có video thành công trên nhánh renders (chưa render, hoặc lần trước lỗi)
            for f in $ALL; do
              id=$(basename $(dirname $f))
              node -e "let ok=false;try{ok=JSON.parse(require('fs').readFileSync('prev/status/$id.json')).ok===true}catch{}process.exit(ok?0:1)" || FILES="$FILES $f"
            done
            # Chỉ giữ kịch bản còn tồn tại và không phải phim kể chuyện
            FILES=$(for f in $FILES; do echo "$ALL" | grep -qx "$f" && echo $f; done | sort -u | tr '\n' ' ')
          fi
          echo "files=$(echo $FILES)" >> "$GITHUB_OUTPUT"
          echo "Sẽ render: $FILES"

      - name: Tạo giọng, dựng và render
        if: steps.pick.outputs.files != ''
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: npx hyperframes doctor || true; node scripts/ci.mjs ${{ steps.pick.outputs.files }}

      - name: Ghi kết quả vào nhánh renders
        if: always() && steps.pick.outputs.files != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p pub
          cp -r prev/. pub/ 2>/dev/null || true
          mkdir -p pub/out pub/cache pub/status
          cp -r out/. pub/out/ 2>/dev/null || true
          cp -r cache/. pub/cache/ 2>/dev/null || true
          cp -r status/. pub/status/ 2>/dev/null || true
          echo "${GITHUB_SHA}" > pub/LAST_COMMIT
          cd pub
          git init -q -b renders
          git add -A
          git -c user.name="render-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "render ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" renders
